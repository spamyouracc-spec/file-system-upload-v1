<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Manager v1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>File Manager v1</h1>

      <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="fileInput" name="file" required />
        <button type="submit">Upload File</button>
      </form>

      <div id="status" class="status">Ready</div>

      <table>
        <thead>
          <tr>
            <th>File Name</th>
            <th>Size</th>
            <th>Uploaded</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="fileTableBody"></tbody>
      </table>
    </div>

    <script>
      const fileTableBody = document.getElementById('fileTableBody');
      const uploadForm = document.getElementById('uploadForm');
      const status = document.getElementById('status');

      function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return `${(bytes / 1024 ** i).toFixed(2)} ${sizes[i]}`;
      }

      function formatDate(dateString) {
        return new Date(dateString).toLocaleString();
      }

      async function loadFiles() {
        try {
          const response = await fetch('/api/files');
          const files = await response.json();

          fileTableBody.innerHTML = '';

          if (!files.length) {
            fileTableBody.innerHTML = '<tr><td colspan="4">No files uploaded yet.</td></tr>';
            return;
          }

          files.forEach((file) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${file.name}</td>
              <td>${formatBytes(file.size)}</td>
              <td>${formatDate(file.uploadedAt)}</td>
              <td>
                <a href="/api/files/${encodeURIComponent(file.name)}" target="_blank">Download</a>
                <button class="delete-btn" data-name="${file.name}">Delete</button>
              </td>
            `;
            fileTableBody.appendChild(row);
          });

          document.querySelectorAll('.delete-btn').forEach((button) => {
            button.addEventListener('click', async () => {
              const fileName = button.dataset.name;
              const response = await fetch(`/api/files/${encodeURIComponent(fileName)}`, {
                method: 'DELETE'
              });

              const result = await response.json();
              if (response.ok) {
                status.textContent = result.message;
                loadFiles();
              } else {
                status.textContent = result.message || 'Delete failed.';
              }
            });
          });
        } catch (error) {
          status.textContent = 'Error loading files.';
          console.error(error);
        }
      }

      uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const input = document.getElementById('fileInput');
        const file = input.files[0];

        if (!file) {
          status.textContent = 'Please choose a file first.';
          return;
        }

        const formData = new FormData();
        formData.append('file', file);

        try {
          const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (response.ok) {
            status.textContent = result.message;
            uploadForm.reset();
            loadFiles();
          } else {
            status.textContent = result.message || 'Upload failed.';
          }
        } catch (error) {
          status.textContent = 'Upload failed.';
          console.error(error);
        }
      });

      loadFiles();
    </script>
  </body>
</html>
